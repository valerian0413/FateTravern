[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trpg"
version = "0.2.0"
description = "Single-player local AI tabletop RPG backend"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "aiohttp>=3.9.0",
  "crewai>=1.15.41,<1.16",
  "aiosqlite>=0.20.0",
  "chromadb>=1.5.9,<1.6",
  "onnxruntime>=1.16,<2",
  "numpy>=1.24,<3",
  "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
